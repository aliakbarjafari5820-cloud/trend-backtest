name: ichimoku
on: [workflow_dispatch]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        tf: ["5m", "15m", "30m", "1h", "4h"]
    env:
      STRATEGY: ichimoku
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pandas numpy
      - run: python trend_backtest.py ${{ matrix.tf }}
