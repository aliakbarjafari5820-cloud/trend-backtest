name: report-from-run
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "ID اجرای smc-pa-hybrid", required: true }
      symbols: { description: "فقط این ارزها (خالی = همه)", required: false, default: "" }
      outdir: { description: "پوشهٔ خروجی", required: false, default: "results" }
permissions:
  contents: write
  actions: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pandas numpy requests
      - uses: actions/download-artifact@v4
        with:
          pattern: "trades-*"
          path: smc/all
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cd smc && SYMBOLS="${{ inputs.symbols }}" python aggregate.py && SYMBOLS="${{ inputs.symbols }}" python report_html.py results results/FINAL_COMPARISON_REPORT.html
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          rm -rf "${{ inputs.outdir }}" && cp -r smc/results "${{ inputs.outdir }}"
          git add "${{ inputs.outdir }}" && git commit -m "Final comparison report (run ${{ inputs.run_id }})" && git pull --rebase && git push
